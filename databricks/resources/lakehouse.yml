# Notebooks 04-06: raw files -> bronze -> silver -> gold, on serverless compute. Two jobs:
#
#   training_data (04 and 05 in one job; Airflow starts it every month, notebook 06):
#     copy_raw ──┬──▶ bronze_reference ──┬──▶ silver_dms ──▶ quality_checks (scope dms) ──▶ gold (dbt build)
#                ├──▶ bronze_dms ─────────┘
#                └──▶ bronze_mavedb ──▶ silver_mavedb (notebooks 07b, 07c; also needs bronze_reference)
#
#   structures (notebook 07d; run when the AlphaFold version changes, not monthly):
#     copy_raw ──▶ bronze_alphafold ──▶ silver_structure (also needs bronze.uniprot_proteome from training_data)
#
#   old_predictions (run in chapter 09, to compare old and new proteome-wide predictions;
#   needs the reference tables from training_data):
#     copy_raw ──▶ bronze_proteome ──▶ silver_proteome ──▶ quality_checks (scope proteome)
#
#   lake_export (notebook 10a): gold.fct_variant_effect ──▶ parquet files ──▶ upload links ──▶ the AWS lake

resources:
  schemas:
    raw:
      catalog_name: ${var.catalog}
      name: raw
      comment: Files copied from the AWS raw bucket, exactly as received
      grants: # Airflow may enter this schema, to reach the volume below
        - principal: ${var.airflow_sp}
          privileges: [USE_SCHEMA]
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Tables loaded from the raw files without cleaning
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Cleaned tables with a defined grain, typed columns and quality checks
    staging:
      catalog_name: ${var.catalog}
      name: staging
      comment: dbt staging views, one per source table, lightly cleaned (notebook 05)
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Tables organised by use (dimensions and facts), built by dbt from silver (notebook 05)
    ml:
      catalog_name: ${var.catalog}
      name: ml
      comment: What the models produce - cross-validation scores and predictions (notebook 07f); registered models (09)

  # One MLflow experiment for every model of this project, so their runs can be compared side by side.
  experiments:
    variant_effect:
      name: /Users/${workspace.current_user.userName}/qafi-variant-effect

  volumes:
    files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: files
      volume_type: MANAGED
      comment: Raw files under the same paths as in S3 (datasets/<dataset>/<version>/<file>)
      grants: # Airflow puts the transfer list here (notebook 06); writing a file needs both privileges
        - principal: ${var.airflow_sp}
          privileges: [READ_VOLUME, WRITE_VOLUME]
    ml_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.ml.name}
      name: files
      volume_type: MANAGED
      comment: Results of models trained outside Databricks, on their way into the ml tables (notebook 08a)

  jobs:
    training_data:
      name: qafi training data
      max_concurrent_runs: 1
      timeout_seconds: 3600 # a run that hangs is stopped after an hour instead of using up the quota
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"] # resolved at deploy time, not written in git
      # Airflow's machine identity may start this job and follow its runs; it cannot change it. The job
      # still runs as its owner (you), so whoever holds the identity's secret can start it: the secret
      # stays in AWS Secrets Manager and is replaced every 90 days (notebook 06).
      permissions:
        - service_principal_name: ${var.airflow_sp}
          level: CAN_MANAGE_RUN
      # Every run says which release of each dataset it loads. The defaults are the pinned versions in
      # config/sources.toml; Airflow passes newer ones when a new release has come in.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: clinvar_version
          default: "2026-10"
        - name: uniprot_version
          default: "2026_03"
        - name: proteingym_version
          default: "v1.3"
        - name: mavedb_version
          default: "2026-06-25"
      environments:
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies: ["dbt-databricks>=1.12,<1.13"]
      tasks:
        - task_key: copy_raw
          max_retries: 2 # downloads can fail for a moment; data problems are not retried
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/notebooks/copy_raw.py
        - task_key: bronze_reference
          depends_on: [{ task_key: copy_raw }]
          notebook_task:
            notebook_path: ../src/notebooks/bronze_reference.py
        - task_key: bronze_dms
          depends_on: [{ task_key: copy_raw }]
          notebook_task:
            notebook_path: ../src/notebooks/bronze_dms.py
        - task_key: bronze_mavedb
          depends_on: [{ task_key: copy_raw }]
          notebook_task:
            notebook_path: ../src/notebooks/bronze_mavedb.py
        - task_key: silver_mavedb
          depends_on: [{ task_key: bronze_mavedb }, { task_key: bronze_reference }]
          notebook_task:
            notebook_path: ../src/notebooks/silver_mavedb.py
        - task_key: silver_dms
          depends_on: [{ task_key: bronze_reference }, { task_key: bronze_dms }]
          notebook_task:
            notebook_path: ../src/notebooks/silver_dms.py
        - task_key: quality_checks
          depends_on: [{ task_key: silver_dms }]
          notebook_task:
            notebook_path: ../src/notebooks/quality_checks.py
            base_parameters: { scope: dms }
        # Notebook 05's dbt project, run on the SQL warehouse: the gold tables and their tests.
        - task_key: gold
          depends_on: [{ task_key: quality_checks }]
          environment_key: dbt
          dbt_task:
            project_directory: ../../dbt
            # Everything but the feature tables: they also need the structure and language-model tables,
            # which the jobs structures and language_model fill. The baseline job builds them.
            commands: ["dbt build --exclude stg_residue_structure+ stg_residue_language_model+ fct_variant_effect"]
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: gold

    old_predictions:
      name: qafi old proteome predictions
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: limit
          default: "0" # proteins to load; 0 = all
      tasks:
        - task_key: copy_raw
          notebook_task:
            notebook_path: ../src/notebooks/copy_raw.py
        - task_key: bronze_proteome
          depends_on: [{ task_key: copy_raw }]
          notebook_task:
            notebook_path: ../src/notebooks/bronze_proteome.py
        - task_key: silver_proteome
          depends_on: [{ task_key: bronze_proteome }]
          notebook_task:
            notebook_path: ../src/notebooks/silver_proteome.py
        - task_key: quality_checks
          depends_on: [{ task_key: silver_proteome }]
          notebook_task:
            notebook_path: ../src/notebooks/quality_checks.py
            base_parameters: { scope: proteome }

    structures:
      name: qafi structures
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: alphafold_version
          default: "v6"
        - name: limit
          default: "0" # at most this many new proteins, for a trial run; 0 = all
        - name: batch_size
          default: "2000" # proteins per batch; each batch is saved before the next starts
        - name: proteins_per_task
          default: "20" # small tasks keep every core busy and let serverless add machines
        - name: rebuild
          default: "false" # true: compute every protein again (a new AlphaFold version)
      tasks:
        - task_key: copy_raw
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/notebooks/copy_raw.py
        - task_key: bronze_alphafold
          depends_on: [{ task_key: copy_raw }]
          notebook_task:
            notebook_path: ../src/notebooks/bronze_alphafold.py
        - task_key: silver_structure
          depends_on: [{ task_key: bronze_alphafold }]
          notebook_task:
            notebook_path: ../src/notebooks/silver_structure.py

    language_model:
      name: qafi language model
      max_concurrent_runs: 1
      timeout_seconds: 10800
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: model_version
          default: "08e4846e537177426273712802403f7ba8261b6c" # ESM-2 650M's Hugging Face commit
        - name: limit
          default: "0" # at most this many proteins, for a trial run; 0 = all
        - name: batch_size
          default: "1000" # proteins per batch; each batch is saved before the next starts
        - name: tokens_per_batch
          default: "16384" # amino acids the GPU reads at once
        - name: backfill
          default: "" # a volume folder of results read elsewhere (a laptop's GPU), loaded by load_language_model
        - name: rebuild
          default: "false" # true: read every protein again
      environments:
        - environment_key: gpu
          spec:
            base_environment: databricks_ai_v6 # PyTorch with CUDA; transformers is pinned in the notebook
      tasks:
        - task_key: copy_raw
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/notebooks/copy_raw.py
        - task_key: load_language_model # needs no GPU
          notebook_task:
            notebook_path: ../src/notebooks/load_language_model.py
        # Needs bronze.uniprot_proteome and gold.fct_variant_label from the training_data job, and a GPU
        # quota: Free Edition has none (gpu-quota-denied), so there run the job with --only load_language_model.
        - task_key: silver_language_model
          depends_on: [{ task_key: copy_raw }, { task_key: load_language_model }]
          environment_key: gpu
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../src/notebooks/silver_language_model.py

    baseline:
      name: qafi baseline model
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: experiment
          default: ${resources.experiments.variant_effect.name}
        - name: runs
          default: all # names from qafi_core.baseline.RUNS, comma-separated; all = the baseline and its ablations
        - name: n_folds
          default: "5"
        - name: code_version
          default: ${bundle.git.commit} # recorded with every MLflow run: which code produced it
      environments:
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies: ["dbt-databricks>=1.12,<1.13"]
      tasks:
        # Needs gold.fct_variant_label (job training_data), silver.residue_structure (job structures) and
        # silver.residue_language_model (job language_model).
        - task_key: features
          environment_key: dbt
          dbt_task:
            project_directory: ../../dbt
            commands:
              ["dbt build --select amino_acid blosum62 stg_residue_structure+ stg_residue_language_model+ --exclude dim_residue_proteome+"]
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: gold
        - task_key: train_baseline
          depends_on: [{ task_key: features }]
          notebook_task:
            notebook_path: ../src/notebooks/train_baseline.py

    # Notebook 10a: the released scores into the AWS lake. The notebook signs the upload links first and
    # puts them into the volume ml/files/_export; this job writes the files and uploads them.
    lake_export:
      name: qafi lake export
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source
          default: gold.fct_variant_effect # one release of every scored variant (notebook 09c)
      tasks:
        - task_key: export_lake
          notebook_task:
            notebook_path: ../src/notebooks/export_lake.py
