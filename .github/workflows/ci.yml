# Continuous integration: runs on every push and pull request.
# Every job must pass before a change can be merged into main.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # lets the aws job request an OIDC token (no stored AWS secrets)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # full version: setup-uv publishes no floating major tags
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Committed notebooks carry no outputs (account IDs, emails, data); the git filter strips them locally.
      - run: git ls-files -z '*.ipynb' | xargs -0 uv run nbstripout --verify
      # The dbt project must parse: models, tests and docs reference each other correctly. No connection is
      # opened, so placeholder connection details are enough.
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
        env:
          DATABRICKS_HOST: ci.invalid
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
          DATABRICKS_TOKEN: placeholder

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # full version: setup-uv publishes no floating major tags
      - run: uv sync --frozen
      # Unit tests check the code; golden tests re-derive the paper's published numbers.
      - run: uv run pytest -q

  # The Airflow DAG must load: a DAG file with an error silently stops all of its scheduled runs.
  # Airflow has its own environment (airflow/pyproject.toml).
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # full version: setup-uv publishes no floating major tags
      - run: uv run --project airflow --frozen pytest airflow/tests -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra/dev fmt -check -recursive
      - run: terraform -chdir=infra/dev init -backend=false -input=false
      - run: terraform -chdir=infra/dev validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f containers/Dockerfile -t qafi-platform .
      - run: docker run --rm qafi-platform
      # The API's image (notebook 10b): it builds, starts, and answers its health check, no AWS needed.
      - run: docker build -f containers/api.Dockerfile -t qafi-api .
      - run: |
          docker run -d --name api -p 8080:8080 qafi-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs api
          exit 1

  # Proves that CI can act in the AWS account through OIDC: GitHub's short-lived token
  # is exchanged for temporary credentials of a role, so no AWS key is stored anywhere.
  aws:
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    needs: [lint, test, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - run: aws sts get-caller-identity
