# dbt project: gold tables built from silver with SQL, each with tests and documentation (notebook 05).
#   staging/  light cleaning of each source, one view per source table (schema staging)
#   marts/    the gold tables, organised by use: dimensions (dim_) and facts (fct_)
#   seeds/    small fixed tables kept in git, such as the locked train/test split (notebook 07a)
# Run from this folder:  dbt build  (models and tests, in dependency order)

name: qafi
version: "1.0.0"
profile: qafi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  qafi:
    +persist_docs: # descriptions become table and column comments in Unity Catalog
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold

seeds:
  qafi:
    +schema: gold
    +persist_docs:
      relation: true
      columns: true

# Labels (notebook 07c): a dataset gives labels only when its two anchors can be trusted.
vars:
  label_min_synonymous: 1 # variants defining 1 (like the wild type)
  label_min_nonsense: 3 # variants defining 0 (protein cut short)
  label_min_missense: 50
  label_min_separation: 0.5 # |anchor 1 - anchor 0| relative to the 10th-90th percentile range of missense scores
  label_min_numbering_agreement: 0.95 # share of reference residues that match UniProt
  label_min: -1 # labels are clipped to [-1, 3], as in Lafita et al. 2024
  label_max: 3
  # Features (notebook 07f)
  amino_acids: ACDEFGHIKLMNPQRSTVWY # the order of ESM-2's 20 log-probabilities (lakehouse.language_model)
  residue_scope: labelled # dim_residue covers the proteins of the split; "proteome" covers all (notebook 09)
