# dbt project: gold tables built from silver with SQL, each with tests and documentation (notebook 05).
#   staging/  light cleaning of each source, one view per source table (schema staging)
#   marts/    the gold tables, organised by use: dimensions (dim_) and facts (fct_)
#   seeds/    small fixed tables kept in git, such as the locked train/test split (notebook 07a)
# Run from this folder:  dbt build  (models and tests, in dependency order)

name: qafi
version: "1.0.0"
profile: qafi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  qafi:
    +persist_docs: # descriptions become table and column comments in Unity Catalog
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold

seeds:
  qafi:
    +schema: gold
    +persist_docs:
      relation: true
      columns: true
