version: 2

seeds:
  - name: protein_split
    description: >
      Which labelled proteins train the model and which are kept for the final test (notebooks 07a, 07c).
      Related proteins (similar sequences) share a similarity_group and are always on the same side. Rows are
      only ever added, by qafi_core.validation.lock_split and extend_split; never edit one by hand or remove
      one, so no decision can be fitted to the test set.
    columns:
      - name: uniprot_id
        description: UniProt accession of a protein with DMS measurements or variant labels.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_protein')
                field: uniprot_id
      - name: similarity_group
        description: >
          Accession of the group's representative. A protein is in the group when it is related to that
          representative (E-value < 1e-5, >= 30% identity over half the shorter protein).
        data_tests: [not_null]
      - name: split
        description: train (cross-validation and model selection) or test (only the final evaluation).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [train, test]
