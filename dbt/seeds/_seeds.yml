version: 2

seeds:
  - name: protein_split
    description: >
      Which labelled proteins train the model and which are kept for the final test (notebooks 07a, 07c).
      Related proteins (similar sequences) share a similarity_group and are always on the same side. Rows are
      only ever added, by qafi_core.validation.lock_split and extend_split; never edit one by hand or remove
      one, so no decision can be fitted to the test set.
    columns:
      - name: uniprot_id
        description: UniProt accession of a protein with DMS measurements or variant labels.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_protein')
                field: uniprot_id
      - name: similarity_group
        description: >
          Accession of the group's representative. A protein is in the group when it is related to that
          representative (E-value < 1e-5, >= 30% identity over half the shorter protein).
        data_tests: [not_null]
      - name: split
        description: train (cross-validation and model selection) or test (only the final evaluation).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [train, test]

  - name: amino_acid
    description: >
      The 20 amino acids with the properties behind the substitution features (notebook 07f). Written by
      qafi_core.features.amino_acid_table; a test checks the file is exactly what that function returns.
    config:
      column_types: { aa: string, code3: string, hydrophobicity: double, volume: double, charge: int }
    columns:
      - name: aa
        description: One-letter code.
        data_tests: [unique, not_null]
      - name: code3
        description: Three-letter code, as in variant names such as p.Arg175His.
        data_tests: [unique, not_null]
      - name: hydrophobicity
        description: Kyte-Doolittle hydropathy (1982); positive = hydrophobic.
        data_tests: [not_null]
      - name: volume
        description: Residue volume in cubic angstrom (Zamyatnin 1972).
        data_tests: [not_null]
      - name: charge
        description: Charge at neutral pH (D and E -1, K and R +1, the others 0).
        data_tests: [not_null]

  - name: blosum62
    description: >
      BLOSUM62 score of every ordered pair of amino acids, 400 rows (notebook 07f): how often the exchange is
      seen between related proteins. Written by qafi_core.features.blosum62_table.
    config:
      column_types: { ref_aa: string, alt_aa: string, score: int }
    columns:
      - name: ref_aa
        description: Amino acid being replaced.
        data_tests: [not_null]
      - name: alt_aa
        description: Amino acid replacing it.
        data_tests: [not_null]
      - name: score
        description: BLOSUM62 score; positive = common in evolution, negative = rare.
        data_tests: [not_null]
