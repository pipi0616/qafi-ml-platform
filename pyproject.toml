[project]
name = "qafi-ml-platform"
version = "0.1.0"
description = "Cloud-native ML platform on AWS for proteome-scale variant effect prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.85",
    "boto3[crt]>=1.40",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "moto[server]>=5.0",     # local fake AWS, used to test notebooks and code without touching the real account
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "databricks-sdk>=0.72",
    "dbt-databricks>=1.12",
    "torch>=2.8",            # ESM-2 runs on Databricks GPUs; locally on the CPU for tests and small examples
    "transformers>=4.56",
    "xgboost>=3.0",
]

# PyTorch's default Linux wheels bundle CUDA (gigabytes); tests and CI only need the CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- packaging: makes `import qafi_platform` work everywhere (uv run, pytest, Docker) ---
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qafi_platform", "src/qafi_core"]

# --- code style: one tool for linting and formatting ---
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, import order, bugbear, modern syntax

# Code under databricks/ runs on Databricks serverless, which is Python 3.11.
[tool.ruff.per-file-target-version]
"databricks/**/*.py" = "py311"

[tool.ruff.lint.per-file-ignores]
"databricks/src/notebooks/*.py" = ["F821"]   # spark, dbutils and display are provided by Databricks

# --- tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["databricks/src"]   # lets the tests import the code the Databricks jobs run
addopts = "-ra"
markers = ["golden: re-derives a number published in the QAFI paper"]
