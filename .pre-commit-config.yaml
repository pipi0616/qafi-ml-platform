# Runs on every `git commit`. Install once with:  uv run pre-commit install
# Notebook outputs (account IDs, emails, data) are stripped by a git filter instead, so they stay in your
# notebooks and never reach git. Install once with:  uv run nbstripout --install --attributes .gitattributes
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=15000]       # the golden datasets are ~10 MB; raw data never enters git
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
